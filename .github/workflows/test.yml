name: Go tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "v2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: |
            go.mod
            v2/go.mod
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Race test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
